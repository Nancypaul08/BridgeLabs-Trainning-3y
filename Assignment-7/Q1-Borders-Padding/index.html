<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Borders & Padding</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Borders &amp; Padding</h1><p>Hover over a box to change its border.</p></header><main><section class="boxes" aria-label="Border examples"><article class="box solid"><h2>Solid</h2><p>Padding: 1rem</p></article><article class="box dashed"><h2>Dashed</h2><p>Padding: 2rem 1rem</p></article><article class="box double"><h2>Double</h2><p>Padding: 1rem 2rem</p></article><article class="box groove"><h2>Groove</h2><p>Padding: 2.5rem</p></article></section></main><footer>CSS border styles demonstration</footer></body></html>
