<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Box Model</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Box Model Exploration</h1></header><main><section class="examples"><article><h2>Default content-box</h2><div class="margin"><div class="border"><div class="padding"><div class="content">Content<br>160px wide</div></div></div></div></article><article><h2>border-box</h2><div class="margin"><div class="border sized"><div class="padding"><div class="content">Content<br>total 200px wide</div></div></div></div></article></section><section class="key"><p><b>Yellow margin:</b> space outside the box. <b>Blue border:</b> its visible edge. <b>Green padding:</b> inner breathing room. <b>White content:</b> the actual text area.</p></section></main><footer>Margin → Border → Padding → Content</footer></body></html>
