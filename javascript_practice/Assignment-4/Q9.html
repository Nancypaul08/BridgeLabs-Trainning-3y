<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopping Cart Coupon</title><style>body{font:16px system-ui;max-width:520px;margin:40px auto;padding:0 18px}</style></head><body><h1>Shopping Cart and Coupon</h1><p>Sample cart: 2 notebooks ($5.50 each) and 3 pens ($1.25 each).</p><p>Subtotal: $14.75</p><label for="coupon">Coupon code (for example, SAVE20 or DISC10)</label><input id="coupon" autocomplete="off"><button id="apply-coupon">Apply coupon</button><p id="coupon-result" aria-live="polite"></p><script src="Q9.js"></script><script>
const couponCart = new Cart(); couponCart.addItem("Notebook", 5.5, 2); couponCart.addItem("Pen", 1.25, 3);
document.querySelector("#apply-coupon").addEventListener("click", () => { const result = couponCart.applyCoupon(document.querySelector("#coupon").value); document.querySelector("#coupon-result").textContent = result.valid ? `${result.discount}% discount applied. Final total: $${result.total.toFixed(2)}` : "Invalid coupon. Use SAVE20 or DISC10 format (1–99)."; });
</script></body></html>
