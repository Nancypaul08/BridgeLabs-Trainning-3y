<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Custom Dropdown</title><style>body{font:16px system-ui;max-width:540px;margin:40px auto;padding:0 18px}#custom-dropdown{position:relative;display:inline-block}.dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;padding:5px;background:#fff;border:1px solid #aaa;box-shadow:0 4px 12px #0002;z-index:1}.dropdown-menu button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px;cursor:pointer}.dropdown-menu button:hover{background:#e8f1ff}#dropdown-toggle{padding:10px 16px}[hidden]{display:none!important}</style></head><body><h1>Custom Dropdown</h1><div id="custom-dropdown"><button id="dropdown-toggle" type="button" aria-expanded="false" aria-controls="dropdown-options">Choose a fruit</button><div id="dropdown-options" class="dropdown-menu" hidden><button type="button" data-option="Apple">Apple</button><button type="button" data-option="Banana">Banana</button><button type="button" data-option="Mango">Mango</button></div></div><p>Click elsewhere on the page to close the options.</p><script src="Q8.js"></script></body></html>
