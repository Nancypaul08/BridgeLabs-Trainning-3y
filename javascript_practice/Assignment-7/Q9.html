<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Live Form Validation</title><style>body{font:16px system-ui;max-width:540px;margin:40px auto;padding:0 18px}label{display:block;margin:14px 0}input{display:block;box-sizing:border-box;width:100%;padding:9px;margin-top:5px}.field-error{color:#b00;min-height:1.4em;margin:3px 0}button{padding:9px 15px}.success{color:#18743a;font-weight:600}</style></head><body><h1>Form Validation</h1><form id="validation-form" novalidate><label>Name <input name="name" autocomplete="name" aria-describedby="name-error"></label><p id="name-error" class="field-error" aria-live="polite"></p><label>Email <input name="email" type="text" autocomplete="email" aria-describedby="email-error"></label><p id="email-error" class="field-error" aria-live="polite"></p><label>Password <input name="password" type="password" autocomplete="new-password" aria-describedby="password-error"></label><p id="password-error" class="field-error" aria-live="polite"></p><button>Submit</button></form><p id="form-success" class="success" aria-live="polite"></p><script src="Q9.js"></script></body></html>
