<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Theme Switcher</title><style>body{font:16px system-ui;min-height:100vh;margin:0;padding:40px;box-sizing:border-box;transition:background .2s,color .2s}.theme-light{background:#fff;color:#202938}.theme-dark{background:#202938;color:#f3f5f8}.theme-blue{background:#dcecff;color:#123c70}button{padding:10px 16px;margin:4px}</style></head><body class="theme-light" data-theme="light"><h1>Theme Switcher</h1><p>Choose a theme. The body class and data-theme attribute update together.</p><button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="blue">Blue</button><p id="active-theme">Current theme: light</p><script src="Q4.js"></script></body></html>
