<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Multi-Step Form</title><style>body{font:16px system-ui;max-width:540px;margin:40px auto;padding:0 18px}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:9px}.field-error{color:#b00}.step-actions{display:flex;gap:10px;margin-top:16px}button{padding:9px 15px}[hidden]{display:none!important}</style></head><body><h1>Registration: Step <span id="step-number">1</span> of 3</h1><form id="wizard-form" novalidate>
<section data-step><label>Name <input name="name" autocomplete="name"></label><p class="field-error" aria-live="polite"></p><button type="button" data-next>Next</button></section>
<section data-step hidden><label>Email <input name="email" type="email" autocomplete="email"></label><p class="field-error" aria-live="polite"></p><div class="step-actions"><button type="button" data-back>Back</button><button type="button" data-next>Next</button></div></section>
<section data-step hidden><label>Password <input name="password" type="password" autocomplete="new-password"></label><p class="field-error" aria-live="polite"></p><div class="step-actions"><button type="button" data-back>Back</button><button type="button" data-next>Finish</button></div></section>
</form><section id="wizard-summary" hidden><h2>Summary</h2><p>Name: <span id="summary-name"></span></p><p>Email: <span id="summary-email"></span></p><p>Password: <span id="summary-password"></span></p><button id="wizard-restart" type="button">Start again</button></section>
<script src="Q3.js"></script></body></html>
