<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Character Counter</title><style>body{font:16px system-ui;max-width:620px;margin:40px auto;padding:0 18px}textarea{box-sizing:border-box;width:100%;min-height:180px;padding:10px}.counter{color:#333}.warning{color:#a87400;background:#fff1b8;padding:4px}.limit-reached{color:#c00;background:#ffe0e0;padding:4px}</style></head><body><h1>Live Character Counter</h1><label for="message">Message (maximum 100 characters)</label><textarea id="message" aria-describedby="character-counter"></textarea><p id="character-counter" class="counter" aria-live="polite"></p><button id="reset-message" type="button">Reset</button><script src="Q2.js"></script></body></html>
