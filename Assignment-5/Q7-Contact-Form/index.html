<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact Us</title><link rel="stylesheet" href="style.css"></head>
<body><main class="contact-page"><section class="form-card" aria-labelledby="contact-title"><p class="eyebrow">LET'S CONNECT</p><h1 id="contact-title">Send us a message</h1><p>We would love to hear about your question or project.</p><form action="#" method="post"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your full name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="How can we help?" required></div><div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your message here" required></textarea></div><button type="submit">Send message</button></form></section></main></body></html>
