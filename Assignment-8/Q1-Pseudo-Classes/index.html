<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pseudo-Classes</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Pseudo-Class States</h1></header><main><section class="examples"><article><h2>:hover</h2><a href="#hover">Hover this link</a><p>Changes when the pointer is over it.</p></article><article><h2>:focus</h2><input type="text" placeholder="Focus this input"><p>Appears when an element is selected.</p></article><article><h2>:active</h2><button>Press me</button><p>Applies while a button is pressed.</p></article><article><h2>:nth-child()</h2><ul><li>First</li><li>Second</li><li>Third</li></ul><p>Targets selected list positions.</p></article></section></main><footer>Interactive CSS selectors</footer></body>
</html>
