<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Box Sizing</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>Box-Sizing Comparison</h1></header><main><section class="comparison"><article class="box default"><h2>content-box</h2><p>Width measures only content; padding and border add to the final size.</p></article><article class="box border-box"><h2>border-box</h2><p>Width includes content, padding, and border within one final size.</p></article></section></main><footer>Both declared widths: 220px</footer></body>
</html>
