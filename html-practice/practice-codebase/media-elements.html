<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Media Elements</title>
</head>
<body>
    <h1>HTML Media Elements</h1>

    <h2>Images</h2>
    <img src="https://via.placeholder.com/400x200" alt="Placeholder Image" width="400" height="200">
    <p>The <code>img</code> tag embeds an image. Always use <code>alt</code> for accessibility.</p>

    <h2>Figure and Figcaption</h2>
    <figure>
        <img src="https://via.placeholder.com/300x150" alt="Sample figure image" width="300">
        <figcaption>Fig 1: A sample placeholder image with caption.</figcaption>
    </figure>

    <h2>Audio</h2>
    <audio controls>
        <source src="audio-sample.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <h2>Video</h2>
    <video width="400" controls>
        <source src="video-sample.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <h2>Iframe - Embed YouTube</h2>
    <iframe width="400" height="225"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video"
        allowfullscreen>
    </iframe>
</body>
</html>
