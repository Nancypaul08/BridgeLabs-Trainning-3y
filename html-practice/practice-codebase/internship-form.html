<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
</head>
<body>

    <h1>Internship Application Form</h1>

    <form action="#" method="post">

       
        <h2>Personal Details</h2>

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Create a password" required><br><br>

        <h2>Gender</h2>

        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label><br><br>


        <h2>Course</h2>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="cse">CSE</option>
            <option value="it">IT</option>
            <option value="ece">ECE</option>
            <option value="mechanical">Mechanical</option>
        </select><br><br>

        <h2>Skills</h2>

        <label><input type="checkbox" name="skills" value="java"> Java</label>
        <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
        <label><input type="checkbox" name="skills" value="html"> HTML</label>
        <label><input type="checkbox" name="skills" value="css"> CSS</label>
        <label><input type="checkbox" name="skills" value="react"> React</label><br><br>

        <h2>Internship Preference</h2>

        <label><input type="radio" name="internship" value="remote" required> Remote</label>
        <label><input type="radio" name="internship" value="onsite"> On-site</label>
        <label><input type="radio" name="internship" value="hybrid"> Hybrid</label><br><br>

        <h2>Resume</h2>

        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br><br>

        <h2>Cover Letter</h2>

        <label for="coverletter">Write your Cover Letter:</label><br>
        <textarea id="coverletter" name="coverletter" rows="6" cols="50" placeholder="Write your cover letter here..." required></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
